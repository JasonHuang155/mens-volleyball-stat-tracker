# Settings for Alembic, the tool that builds and changes the database's tables.
#   uv run alembic upgrade head                     bring the database up to the latest tables
#   uv run alembic revision --autogenerate -m "..."  write a new migration after changing app/models.py
#   uv run alembic downgrade -1                      undo the last migration

[alembic]
script_location = %(here)s/migrations
# Name migration files by date, so they list in the order they were written.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# The database address isn't written here: migrations/env.py takes it from the
# app's settings (the DATABASE_URL environment variable), like the server does.

[post_write_hooks]
# Tidy each new migration file with ruff, like the rest of the code.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
