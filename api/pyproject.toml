[project]
name = "volleyball-api"
version = "0.1.0"
description = "The server for the volleyball stat tracker: stores taps, accounts, and the live box score link."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false # this is an app, not a library to publish

[tool.pytest.ini_options]
pythonpath = ["."] # so tests can `import app`
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F: common errors, I: import order, UP: modern Python syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations can contain long SQL strings that can't be split.
"migrations/versions/*" = ["E501"]
